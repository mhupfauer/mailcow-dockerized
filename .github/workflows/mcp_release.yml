name: Publish mailcow MCP image

on:
  push:
    tags:
      - mcp-v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target image
        id: img
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/mcp" >> "$GITHUB_OUTPUT"
          # mcp-v0.1.0 -> 0.1.0
          echo "version=${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish MCP image
        uses: docker/build-push-action@v7
        with:
          context: data/Dockerfiles/mcp
          push: true
          tags: ${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}
          platforms: linux/amd64
          provenance: true
          sbom: true
