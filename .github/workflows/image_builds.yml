name: Build mailcow Docker Images

on:
  push:
    branches: [ "master", "staging", "feature/**" ]
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)
  packages: write # to push images to ghcr.io/<owner>

jobs:
  docker_image_builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: acme-mailcow
            dir: acme
          - service: clamd-mailcow
            dir: clamd
          - service: dockerapi-mailcow
            dir: dockerapi
          - service: dovecot-mailcow
            dir: dovecot
          - service: mcp-mailcow
            dir: mcp
          - service: netfilter-mailcow
            dir: netfilter
          - service: nginx-mailcow
            dir: nginx
          - service: olefy-mailcow
            dir: olefy
          - service: php-fpm-mailcow
            dir: phpfpm
          - service: postfix-mailcow
            dir: postfix
          - service: postfix-tlspol-mailcow
            dir: postfix-tlspol
          - service: rspamd-mailcow
            dir: rspamd
          - service: sogo-mailcow
            dir: sogo
          - service: unbound-mailcow
            dir: unbound
          - service: watchdog-mailcow
            dir: watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image name and version are the single source of truth in
      # docker-compose.yml. Read them from there so a version bump in the
      # compose file is all that is needed to publish a new tag.
      - name: Resolve image name and version from docker-compose.yml
        id: img
        run: |
          set -euo pipefail
          ref="$(awk -v svc="${SERVICE}" '
            $0 ~ "^    "svc":[[:space:]]*$" { in_svc = 1; next }
            in_svc && /^    [^[:space:]]/   { in_svc = 0 }
            in_svc && $1 == "image:"        { print $2; exit }
          ' docker-compose.yml)"

          if [ -z "${ref}" ]; then
            echo "::error::No image: found for service ${SERVICE} in docker-compose.yml"
            exit 1
          fi
          case "${ref}" in
            ghcr.io/*/*:*) ;;
            *)
              echo "::error::Unexpected image reference '${ref}' for ${SERVICE}, expected ghcr.io/<namespace>/<name>:<version>"
              exit 1
              ;;
          esac

          # Ignore whatever namespace the compose file carries and republish
          # under this repository's owner, so forks build into their own GHCR.
          name="${ref#ghcr.io/*/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "image=ghcr.io/${owner}/${name%%:*}" >> "$GITHUB_OUTPUT"
          echo "version=${name##*:}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=${{ steps.img.outputs.version }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: data/Dockerfiles/${{ matrix.dir }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
